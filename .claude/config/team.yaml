# Team Configuration for AI Reviewer
# This file is auto-generated by install.sh
# Last updated: 2025-02-19

team:
  admins:
    - email: "{{ADMIN_EMAIL}}"
      name: "{{ADMIN_NAME}}"

  members:
    - email: "{{ADMIN_EMAIL}}"
      name: "{{ADMIN_NAME}}"

ai_reviewer:
  enabled: true
  mode: "{{REVIEW_MODE}}"  # manual | semi-auto | auto

  # Review Configuration (API-free, Rule-based)
  # For AI-powered review, use Claude Code's built-in capabilities
  provider: "rule-based"  # rule-based (API-free)

  # Auto Review Settings
  auto_review_on_pr: true
  auto_merge_threshold: 0.9  # Confidence threshold for auto-merge

  # Review Checks
  checks:
    - security         # Security vulnerabilities
    - performance      # Performance issues
    - best_practices   # Code best practices
    - test_coverage    # Test coverage validation
    - documentation    # Documentation completeness
    - error_handling   # Error handling patterns

  # Paths to exclude from auto-merge
  no_auto_merge:
    paths:
      - "prod/*"
      - "production/*"
      - ".env*"
      - "secrets/*"
      - "config/secrets*"
    keywords:
      - "TODO"
      - "HACK"
      - "FIXME"
      - "XXX"
      - "BREAKING"

  # Review Comment Templates
  templates:
    approval: "✅ AI Review: PASSED (confidence: {confidence})"
    request_changes: "⚠️ AI Review: NEEDS CHANGES\n\n{feedback}"
    error: "❌ AI Review: ERROR\n\n{error}"

  # Notification Settings
  notifications:
    on_review_complete: true
    on_auto_merge: true
    on_failure: true

# Git Platform Detection (auto-detected by install.sh)
git_platform: "{{GIT_PLATFORM}}"  # github | gitlab | none
git_remote_url: "{{GIT_REMOTE_URL}}"
