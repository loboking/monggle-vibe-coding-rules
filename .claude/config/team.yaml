# Team Configuration for AI Reviewer
# This file is auto-generated by install.sh
# Last updated: 2026-06-16

team:
  admins:
    - email: "5001422+loboking@users.noreply.github.com"
      name: "loboking"

  members:
    - email: "5001422+loboking@users.noreply.github.com"
      name: "loboking"

ai_reviewer:
  enabled: true
  mode: "manual"

  # Analysis engine: 규칙 기반(rule-based) 정적 분석, 외부 LLM 미호출
  engine: "rule-based"

  # Auto Review Settings
  auto_review_on_pr: true
  auto_merge_threshold: 0.9

  # Review Checks
  checks:
    - security
    - performance
    - best_practices
    - test_coverage
    - documentation
    - error_handling

  # Paths to exclude from auto-merge
  no_auto_merge:
    paths:
      - "prod/*"
      - "production/*"
      - ".env*"
      - "secrets/*"
      - "config/secrets*"
    keywords:
      - "TODO"
      - "HACK"
      - "FIXME"
      - "XXX"
      - "BREAKING"

  # Review Comment Templates
  templates:
    approval: "✅ AI Review: PASSED (confidence: {confidence})"
    request_changes: "⚠️ AI Review: NEEDS CHANGES\n\n{feedback}"
    error: "❌ AI Review: ERROR\n\n{error}"

  # Notification Settings
  notifications:
    on_review_complete: true
    on_auto_merge: true
    on_failure: true

# Git Platform Detection
git_platform: "github"
git_remote_url: "https://github.com/loboking/monggle-vibe-coding-rules.git"
