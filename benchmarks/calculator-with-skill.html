<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calculator {
            background: linear-gradient(145deg, #1e1e30, #2a2a45);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 25px;
            width: 100%;
            max-width: 350px;
        }

        .display {
            background: linear-gradient(145deg, #0a0a15, #151525);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: right;
            box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.5);
        }

        .display-value {
            color: #00ff88;
            font-size: 2.5rem;
            font-weight: 300;
            min-height: 50px;
            word-wrap: break-word;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .display-error {
            color: #ff4757;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            font-size: 1.3rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        button:active {
            transform: scale(0.95);
        }

        .number, .decimal {
            background: linear-gradient(145deg, #2d2d4a, #3a3a5c);
            color: #ffffff;
        }

        .number:hover, .decimal:hover {
            background: linear-gradient(145deg, #3a3a5c, #47476a);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .operator {
            background: linear-gradient(145deg, #e94560, #ff6b6b);
            color: #ffffff;
        }

        .operator:hover {
            background: linear-gradient(145deg, #ff6b6b, #ff8787);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .equals {
            background: linear-gradient(145deg, #00ff88, #00cc6a);
            color: #1a1a2e;
            font-weight: 600;
            grid-column: span 2;
        }

        .equals:hover {
            background: linear-gradient(145deg, #00cc6a, #00ff88);
            box-shadow: 0 5px 15px rgba(0, 255, 136, 0.4);
        }

        .clear {
            background: linear-gradient(145deg, #ff9f43, #ffbe76);
            color: #1a1a2e;
            font-weight: 600;
        }

        .clear:hover {
            background: linear-gradient(145deg, #ffbe76, #ff9f43);
            box-shadow: 0 5px 15px rgba(255, 159, 67, 0.4);
        }

        @media (max-width: 380px) {
            .calculator {
                max-width: 100%;
                margin: 10px;
            }

            .display-value {
                font-size: 2rem;
            }

            button {
                padding: 15px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="display-value" id="display">0</div>
        </div>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendOperator('/')">÷</button>
            <button class="operator" onclick="appendOperator('*')">×</button>
            <button class="operator" onclick="deleteLast()">⌫</button>

            <button class="number" onclick="appendNumber('7')">7</button>
            <button class="number" onclick="appendNumber('8')">8</button>
            <button class="number" onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="appendOperator('-')">−</button>

            <button class="number" onclick="appendNumber('4')">4</button>
            <button class="number" onclick="appendNumber('5')">5</button>
            <button class="number" onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="appendOperator('+')">+</button>

            <button class="number" onclick="appendNumber('1')">1</button>
            <button class="number" onclick="appendNumber('2')">2</button>
            <button class="number" onclick="appendNumber('3')">3</button>
            <button class="number" onclick="appendNumber('0')" style="grid-row: span 2;">0</button>

            <button class="decimal" onclick="appendDecimal()">.</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let currentValue = '0';
        let shouldResetDisplay = false;

        const display = document.getElementById('display');

        function updateDisplay(value = currentValue) {
            display.textContent = value;
            display.classList.remove('display-error');
        }

        function clearDisplay() {
            currentValue = '0';
            shouldResetDisplay = false;
            updateDisplay();
        }

        function appendNumber(num) {
            if (shouldResetDisplay) {
                currentValue = num;
                shouldResetDisplay = false;
            } else if (currentValue === '0') {
                currentValue = num;
            } else if (currentValue.length < 15) {
                currentValue += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            const lastChar = currentValue.slice(-1);

            if (['+', '-', '*', '/'].includes(lastChar)) {
                currentValue = currentValue.slice(0, -1) + op;
            } else {
                currentValue += op;
            }
            shouldResetDisplay = false;
            updateDisplay();
        }

        function appendDecimal() {
            const parts = currentValue.split(/[\+\-\*\/]/);
            const lastPart = parts[parts.length - 1];

            if (!lastPart.includes('.')) {
                if (lastPart === '' || ['+', '-', '*', '/'].includes(currentValue.slice(-1))) {
                    currentValue += '0.';
                } else {
                    currentValue += '.';
                }
                shouldResetDisplay = false;
                updateDisplay();
            }
        }

        function deleteLast() {
            if (currentValue.length > 1) {
                currentValue = currentValue.slice(0, -1);
            } else {
                currentValue = '0';
            }
            updateDisplay();
        }

        function calculate() {
            try {
                const expression = currentValue;
                let result;

                // Check for division by zero
                if (/\/\s*0(?!\d)/.test(expression)) {
                    throw new Error('Division by zero');
                }

                // Safe evaluation
                result = Function('"use strict"; return (' + expression + ')')();

                // Handle special cases
                if (!isFinite(result)) {
                    throw new Error('Invalid result');
                }

                // Round to avoid floating point issues
                result = Math.round(result * 1e10) / 1e10;

                currentValue = result.toString();
                shouldResetDisplay = true;
                updateDisplay();
            } catch (error) {
                if (error.message === 'Division by zero') {
                    display.textContent = 'Error: /0';
                } else {
                    display.textContent = 'Error';
                }
                display.classList.add('display-error');
                shouldResetDisplay = true;
                currentValue = '0';
            }
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                appendNumber(e.key);
            } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                appendOperator(e.key);
            } else if (e.key === '.' || e.key === ',') {
                appendDecimal();
            } else if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculate();
            } else if (e.key === 'Backspace') {
                deleteLast();
            } else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') {
                clearDisplay();
            }
        });
    </script>
</body>
</html>
