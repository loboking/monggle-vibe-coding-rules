# Monggle Vibe Coding Rules - Core Configuration
# Single Source of Truth for all project rules
# This file is synced to .cursorrules and CLAUDE.md

version: "2.2"
last_updated: "2025-02-20"

# Project Mode Configuration
mode:
  # solo: PRD optional for quick iterations
  # team: PRD required for quality assurance
  default: solo
  current: solo  # Auto-updated by /mode command

# PRD Requirements
prd:
  # Required in team mode, optional in solo mode
  required_in_team: true
  required_in_solo: false

  # PRD types and their templates
  types:
    - name: feature
      template: prd/feature.md
      required_sections:
        - Goal
        - Requirements
        - Edge Cases
        - Testing

    - name: bug
      template: prd/bug.md
      required_sections:
        - Issue
        - Description
        - Root Cause
        - Fix Plan
        - Testing

    - name: refactor
      template: prd/refactor.md
      required_sections:
        - Current
        - Issues
        - Proposed Changes
        - Impact
        - Testing

    - name: hotfix
      template: prd/hotfix.md
      required_sections:
        - Issue
        - Quick Fix
        - Testing
      # Fast track for urgent fixes
      skip_scan: false
      skip_fold: true

    - name: experiment
      template: prd/experiment.md
      required_sections:
        - Hypothesis
        - Test Plan
        - Success Criteria

# Interactive PRD Creation (NEW v2.3)
interactive_prd:
  enabled: true
  command: "/init"
  description: "Interactive PRD creation via natural language conversation"

  # PRD types with interactive prompts
  types:
    - name: feature
      prompts:
        - "What should we call this feature?"
        - "What problem does this solve?"
        - "What are the functional requirements?"
        - "What edge cases should we handle?"
        - "How should we test this?"

    - name: bug
      prompts:
        - "What bug are you experiencing?"
        - "Describe the problem in detail"
        - "What's causing the issue (if known)?"
        - "How should we fix it?"
        - "How to verify the fix?"

    - name: refactor
      prompts:
        - "What's the current state?"
        - "What problems exist with current code?"
        - "What changes do you want?"
        - "What impact will this have?"
        - "How to ensure nothing breaks?"

    - name: hotfix
      prompts:
        - "What's the urgent problem?"
        - "What's the immediate fix?"
        - "Quick verification steps?"

    - name: experiment
      prompts:
        - "What are you trying to prove?"
        - "How will you test it?"
        - "How do you measure success?"

# Agent Pipeline Configuration
agents:
  # Execution order matters
  pipeline:
    - gate
    - scan
    - fold
    - verdict
    - patch
    - trace

  # Agent-specific settings
  gate:
    enabled: true
    type: hook
    description: "PRD validation"

  scan:
    enabled: true
    type: python
    script: agents/scan_agent.py
    description: "Codebase impact analysis"

  fold:
    enabled: true
    type: python
    script: agents/fold_agent.py
    description: "Result synthesis and feasibility"

  verdict:
    enabled: true
    type: python
    script: agents/verdict_agent.py
    description: "Final decision (PASS/FIX/FAIL)"
    # Auto-fix feedback threshold
    fix_feedback_threshold: 0.5

  patch:
    enabled: true
    type: python
    script: agents/patch_agent.py
    description: "Code generation/modification"
    max_iterations: 5

  trace:
    enabled: true
    type: python
    script: agents/trace_agent.py
    description: "Execution log tracking"

# Verdict Rules
verdict:
  pass:
    min_confidence: 0.9
    description: "All criteria met, ready for implementation"

  fix:
    min_confidence: 0.5
    description: "Some modifications needed before implementation"
    auto_feedback: true  # Automatically generate fix suggestions

  fail:
    description: "Cannot implement with current requirements"

# Free Chat Rules
free_chat:
  # Development requests require PRD in team mode
  dev_requires_prd_in_team: true
  dev_requires_prd_in_solo: false

  # These requests NEVER require PRD
  prd_exemptions:
    - "explain"
    - "show me"
    - "what is"
    - "how does"
    - "describe"
    - "review code"
    - "analyze"
    - "document"
    - "add comment"
    - "refactor"  # Light refactor without PRD in solo mode
    - "optimize"  # Light optimization in solo mode
    - "help"

# Development Rules
development:
  # Commit message format
  commit_format: "type(scope): description"
  commit_types:
    - feat     # New feature
    - fix      # Bug fix
    - refactor # Code refactoring
    - test     # Adding tests
    - docs     # Documentation
    - chore    # Maintenance

  # Branch rules
  branch_prefix: "dev/{user}/{feature}"
  main_push_blocked: true

  # PR rules
  pr_requires_prd_link: true
  pr_single_feature: true
  pr_ci_blocking: true

# Testing Requirements
testing:
  coverage:
    personal_branch: "80%+"
    pr_creation: "80%+"
    main_merge: "100%"

  test_types:
    - unit     # Unit tests
    - feature  # Feature tests
    - scenario # Scenario tests
    - full     # Full integration
    - integration # Integration tests

# Token Optimization
token_optimization:
  diff_only_output: true
  reference_over_reprint: true
  code_first_approach: true
  avoid_rework: true

  # Prohibited patterns
  prohibit:
    - "unnecessary console.log"
    - "unused imports"
    - "debugging leftovers"
    - "unsolicited feature additions"

# Code Quality
code_quality:
  # Security checks
  security_checks:
    - injection
    - hardcoded_secrets
    - sql_injection
    - xss

  # Error handling
  error_handling:
    - edge_cases
    - null_safety
    - timeout_handling
    - retry_logic

  # Performance
  performance:
    - n_plus_1_queries
    - infinite_loops
    - memory_leaks

# AI Reviewer Settings
ai_reviewer:
  enabled: true
  mode: manual  # manual | semi-auto | auto
  auto_merge_threshold: 0.9
  checks:
    - security
    - performance
    - best_practices
    - test_coverage

# File Sync Configuration
sync:
  # Sync targets from core-rules.yaml
  targets:
    - destination: ".cursorrules"
      format: "editor_config"
      description: "Cursor/Windsurf IDE rules"

    - destination: "CLAUDE.md"
      format: "project_guidelines"
      description: "Claude Code project instructions"

    - destination: ".claude/settings.json"
      format: "claude_settings"
      description: "Claude Code settings"
