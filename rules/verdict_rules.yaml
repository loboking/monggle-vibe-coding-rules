# Verdict Rules
# PASS / FIX / FAIL 판단 규칙 정의
# Agent M 시스템의 agent_m_verdict가 사용하는 판단 기준

version: "1.0"
last_updated: "2025-02-09"

# ============================================================================
# 판정 유형 정의
# ============================================================================

verdict_types:
  pass:
    description: "즉시 구현 진행"
    confidence_threshold: 0.9
    color: "green"
    icon: "✓"

  fix:
    description: "수정 후 재평가 필요"
    confidence_threshold: 0.5
    color: "yellow"
    icon: "⚠"

  fail:
    description: "현재 상태로는 구현 불가"
    confidence_threshold: 0.9
    color: "red"
    icon: "✗"

# ============================================================================
# Gate Agent 결과 기준
# ============================================================================

gate_criteria:
  pass:
    valid: true
    missing_sections: []
    missing_fields: []
    errors: []

  fix:
    # Gate는 FIX를 반환하지 않음 (PASS 또는 FAIL만)
    # FIX는 Scan/Fold 결과에서 결정
    valid: true
    # 경고는 있지만 치명적이 아닌 경우
    errors:
      max_count: 2
      severity: "warning"

  fail:
    valid: false
    # OR
    missing_sections:
      min_count: 1
    # OR
    missing_fields:
      min_count: 1

# ============================================================================
# Scan Agent 결과 기준
# ============================================================================

scan_criteria:
  pass:
    complexity: ["Low", "Medium"]
    conflicts: []
    # OR
    conflicts:
      count: 0
    # OR 관리 가능한 충돌
    manageable_conflicts:
      max_count: 1
      with_solution: true

  fix:
    complexity: "High"
    # OR
    conflicts:
      min_count: 1
      max_count: 3
    # 모든 충돌이 해결 가능해야 함
    all_conflicts_resolvable: true
    # AND
    no_critical_conflicts: true

  fail:
    complexity: "Too High"
    # OR
    conflicts:
      min_count: 4
    # OR
    critical_conflicts:
      min_count: 1
    # OR
    unresolvable_conflicts:
      min_count: 1

# 복잡도 정의
complexity_levels:
  low:
    description: "간단한 구현"
    max_files: 3
    max_lines: 100
    max_dependencies: 2
    examples:
      - "단순 CRUD"
      - "UI 수정"
      - "설정 변경"

  medium:
    description: "중간 난이도"
    max_files: 10
    max_lines: 500
    max_dependencies: 5
    examples:
      - "새로운 API 엔드포인트"
      - "데이터베이스 스키마 변경"
      - "외부 API 연동"

  high:
    description: "복잡한 구현"
    max_files: 20
    max_lines: 1000
    max_dependencies: 10
    examples:
      - "인증 시스템 도입"
      - "마이크로서비스 통합"
      - "대규모 리팩토링"

  too_high:
    description: "위험도가 너무 높음"
    conditions:
      - files: "> 20"
      - lines: "> 1000"
      - dependencies: "> 10"
    examples:
      - "전체 아키텍처 변경"
      - "여러 시스템 동시 수정"

# 충돌 수준 정의
conflict_levels:
  manageable:
    description: "해결 방안이 명확함"
    examples:
      - "버전 충돌 (업그레이드 가능)"
      - "네이밍 충돌 (리네이밍 가능)"
    resolution: "PRD에 해결 방안 포함"

  critical:
    description: "치명적 충돌로 구현 불가"
    examples:
      - "기존 기능과 상충"
      - "보안 취약점 초래"
      - "데이터 손실 가능성"
      - "성능 심각 저하"
    requires: "요구사항 재검토"

# ============================================================================
# Fold Agent 결과 기준
# ============================================================================

fold_criteria:
  pass:
    feasibility: "High"
    blockers: []
    # OR
    blockers:
      # 해결된 차단 요소만 있음
      all_resolved: true
    # AND
    risk_assessment:
      technical: ["Low", "Medium"]
      operational: ["Low", "Medium"]
      security: "Low"

  fix:
    feasibility: ["Medium", "High"]
    # AND
    blockers:
      min_count: 1
      max_count: 3
      # 모든 차단 요소가 해결 가능해야 함
      all_resolvable: true
    # AND
    no_critical_risks: true

  fail:
    feasibility: "Low"
    # OR
    blockers:
      min_count: 4
    # OR
    critical_blockers:
      min_count: 1
    # OR
    unresolvable_blockers:
      min_count: 1
    # OR
    critical_risk:
      security: "High"
      # OR
      operational: "High"
      # OR
      technical: "Critical"

# 구현 가능성 정의
feasibility_levels:
  high:
    description: "모든 조건 충족, 즉시 구현 가능"
    conditions:
      - "모든 요구사항 명확"
      - "기술적 제약 없음"
      - "리소스 충분"
      - "차단 요소 없음"

  medium:
    description: "일부 수정 필요하지만 구현 가능"
    conditions:
      - "요구사항 일부 모호함"
      - "기술적 도전 존재"
      - "리소스 부족 가능"
      - "해결 가능한 차단 요소"

  low:
    description: "구현 어려움, 요구사항 재검토 필요"
    conditions:
      - "요구사항 모호 또는 충돌"
      - "기술적으로 불가능"
      - "리소스 부족"
      - "해결 불가능한 차단 요소"

# 위험도 정의
risk_levels:
  low:
    description: "사소한 영향"
    impact: "일부 기능 장애, 사용성 저하"
    mitigation: "모니터링만으로 충분"

  medium:
    description: "중간 영향"
    impact: "일부 기능 장애, 성능 저하"
    mitigation: "완화 계획 필요"

  high:
    description: "큰 영향"
    impact: "주요 기능 장애, 데이터 일관성 문제"
    mitigation: "상세 완화 계획 필수"

  critical:
    description: "치명적 영향"
    impact:
      - "시스템 장애"
      - "데이터 유실"
      - "보안 침해"
      - "재무적 손실"
    requires: "구현 중단 또는 대안 모색"

# 차단 요소 정의
blocker_types:
  resolvable:
    description: "해결 가능한 차단 요소"
    examples:
      - "마이그레이션 계획 없음 → 계획 수립"
      - "OAuth 승인 대기 → 대기 후 진행"
      - "API 문서 부족 → 문서 작성"
    resolution: "PRD에 해결 방안 포함"

  critical:
    description: "해결 불가능한 치명적 차단 요소"
    examples:
      - "핵심 라이브러리 지원 중단"
      - "보안 규정 위반"
      - "하드웨어 성능 한계"
    requires: "요구사항 재검토 또는 프로젝트 중단"

# ============================================================================
# 종합 판정 로직
# ============================================================================

# 판정 우선순위
verdict_priority:
  # 1순위: Gate 결과가 FAIL이면 전체 FAIL
  - condition: "gate.verdict == 'FAIL'"
    verdict: "FAIL"
    reason: "PRD 유효성 검사 실패"

  # 2순위: Fold 결과가 구현 불가이면 FAIL
  - condition: "fold.feasibility == 'Low'"
    verdict: "FAIL"
    reason: "구현 가능성 낮음"

  # 3순위: 치명적 위험이 있으면 FAIL
  - condition: "fold.critical_risk == true"
    verdict: "FAIL"
    reason: "치명적 위험 감지"

  # 4순위: 모든 조건이 PASS이면 PASS
  - condition: "gate.verdict == 'PASS' AND scan.pass == true AND fold.pass == true"
    verdict: "PASS"
    reason: "모든 검증 통과"

  # 5순위: 그 외의 경우는 FIX
  - condition: "default"
    verdict: "FIX"
    reason: "수정 필요"

# 확신도 계산 공식
confidence_formula:
  # 모든 Agent가 동일하게 PASS → 1.0
  all_pass:
    confidence: 1.0
    condition: "gate.pass AND scan.pass AND fold.pass"

  # 모든 Agent가 동일하게 FAIL → 1.0
  all_fail:
    confidence: 1.0
    condition: "gate.fail OR fold.feasibility == 'Low'"

  # Gate PASS, Scan/FIX, Fold/Medium → 0.7
  mixed_fix:
    confidence: 0.7
    condition: "gate.pass AND scan.fix AND fold.feasibility == 'Medium'"

  # 결과가 상충될 때는 Fold 결과 우선 → 0.8
  conflict_fold_priority:
    confidence: 0.8
    condition: "gate.pass AND scan != fold"
    priority: "fold"

# ============================================================================
# PRD 타입별 특별 규칙
# ============================================================================

prd_specific_rules:
  feature:
    # 기능 개발
    additional_checks:
      - "Goal 명확성"
      - "Requirements 완결성"
      - "Testing 계획 존재"
    strict_mode: true

  bug:
    # 버그 수정
    additional_checks:
      - "Root Cause 분석"
      - "Fix Plan 구체성"
      - "재발 방지 계획"
    strict_mode: false  # 긴급 수정을 위해 덜 엄격

  refactor:
    # 리팩토링
    additional_checks:
      - "Current Issues 명확성"
      - "Impact 분석"
      - "롤백 계획"
    strict_mode: true

  experiment:
    # 실험적 기능
    additional_checks:
      - "Hypothesis 명확성"
      - "Success Criteria 정량화"
      - "실험 종료 조건"
    strict_mode: false  # 실험적 특성상 유연

# ============================================================================
# 자동 판정 예외
# ============================================================================

exceptions:
  # 개발자가 명시적으로 강제 실행 요청 시
  force_override:
    enabled: true
    requires:
      - "명시적 승인"
      - "위험 성시"
    warning_mandatory: true

  # 긴급 핫픽스
  hotfix:
    enabled: true
    conditions:
      - "심각도: Critical/High"
      - "프로덕션 영향"
    bypass_checks:
      - "일부 섹션 누락 허용"
      - "테스트 축소 허용"
    requires:
      - "사후 문서화"

# ============================================================================
# 출력 형식
# ============================================================================

output_format:
  verdict:
    type: "string"
    values: ["PASS", "FIX", "FAIL"]
    required: true

  confidence:
    type: "number"
    range: [0.0, 1.0]
    required: true

  reasoning:
    type: "string"
    max_length: 500
    required: true
    template: "{primary_reason} ({supporting_facts})"

  feedback:
    type: "array"
    items:
      type: "string"
    min_items: 1
    max_items: 5
    required: true

  next_steps:
    type: "array"
    items:
      type: "string"
    min_items: 1
    max_items: 3
    required: true

  conditions:
    type: "array"
    items:
      type: "string"
    required: false  # FIX인 경우에만 필수
    condition: "verdict == 'FIX'"

# ============================================================================
# 버전 관리
# ============================================================================

changelog:
  - version: "1.0"
    date: "2025-02-09"
    changes:
      - "초기 버전 릴리스"
      - "Gate/Scan/Fold 기준 정의"
      - "PRD 타입별 규칙 추가"
      - "확신도 계산 공식 추가"
