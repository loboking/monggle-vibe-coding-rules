# GitLab CI/CD Configuration with AI Reviewer
# Automatically integrates with .claude/config/team.yaml

stages:
  - test
  - review
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Cache Python dependencies
cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python3 -m pip install --upgrade pip
  - pip3 install pyyaml anthropic openai

# Run existing tests
test:
  stage: test
  script:
    - python3 -m pip install pylint black mypy
    - black --check scripts/
    - pylint scripts/init_core.py || true
    - python3 tests/test_agents.py || true
  tags:
    - docker

# AI Reviewer for Merge Requests
ai_review:
  stage: review
  script:
    # Load configuration
    - |
      if [ -f ".claude/config/team.yaml" ]; then
        REVIEW_MODE=$(grep "^mode:" .claude/config/team.yaml | awk '{print $2}' | tr -d '"')
        ENABLED=$(grep "^enabled:" .claude/config/team.yaml | awk '{print $2}')
        API_KEY_ENV=$(grep "api_key_env:" .claude/config/team.yaml | awk '{print $2}' | tr -d '"')
      else
        REVIEW_MODE="manual"
        ENABLED="true"
        API_KEY_ENV="ANTHROPIC_API_KEY"
      fi

    - echo "AI Reviewer mode: $REVIEW_MODE"
    - echo "AI Reviewer enabled: $ENABLED"
    - echo "API Key env: $API_KEY_ENV"

    # Check if enabled
    - |
      if [ "$ENABLED" != "true" ]; then
        echo "AI reviewer is disabled"
        exit 0
      fi

    # Get diff
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        git diff $CI_MERGE_REQUEST_DIFF_BASE_SHA...$CI_COMMIT_SHA > /tmp/mr.diff
      else
        echo "No merge request diff available"
        exit 0
      fi

    # Run AI reviewer based on mode
    - |
      if [ "$REVIEW_MODE" = "manual" ]; then
        echo "Manual mode: Use /review command locally"
        python3 .claude/scripts/ai_reviewer.py --diff /tmp/mr.diff --json || true
      elif [ "$REVIEW_MODE" = "semi-auto" ]; then
        echo "Semi-auto mode: Running AI review..."
        python3 .claude/scripts/ai_reviewer.py --diff /tmp/mr.diff --output /tmp/review_result.json
      elif [ "$REVIEW_MODE" = "auto" ]; then
        echo "Auto mode: Running AI review with auto-merge decision..."
        python3 .claude/scripts/ai_reviewer.py --diff /tmp/mr.diff --output /tmp/review_result.json
      fi
  artifacts:
    paths:
      - /tmp/review_result.json
    expire_in: 1 week
  tags:
    - docker
  only:
    - merge_requests

# Post review comment (requires GitLab API token)
post_review_comment:
  stage: review
  script:
    - |
      if [ ! -f "/tmp/review_result.json" ]; then
        echo "No review result found"
        exit 0
      fi

    # Parse review result
    - STATUS=$(cat /tmp/review_result.json | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
    - CONFIDENCE=$(cat /tmp/review_result.json | python3 -c "import sys, json; print(json.load(sys.stdin)['confidence'])")
    - FEEDBACK=$(cat /tmp/review_result.json | python3 -c "import sys, json; print(json.load(sys.stdin)['feedback'])")

    - echo "Review Status: $STATUS"
    - echo "Confidence: $CONFIDENCE"

    # Post comment using GitLab API (requires GITLAB_TOKEN)
    - |
      if [ -n "$GITLAB_TOKEN" ]; then
        COMMENT_BODY="## 🤖 AI Review Result\n\n**Status:** ${STATUS}\n**Confidence:** ${CONFIDENCE}\n\n${FEEDBACK}"
        curl --request POST \
          --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "{\"body\": \"${COMMENT_BODY}\"}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
      else
        echo "GITLAB_TOKEN not set, skipping comment post"
      fi
  tags:
    - docker
  only:
    - merge_requests
  when: on_success
