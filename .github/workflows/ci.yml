name: Vibe Coding Rules CI

# Vibe Coding Rules 프로젝트 CI 파이프라인

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    name: ShellCheck Bash Scripts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          else
            brew install shellcheck
          fi

      - name: Run ShellCheck on .claude/commands
        run: |
          shellcheck --severity=warning --shell=bash .claude/commands/*.sh

      - name: Run ShellCheck on .claude/lib
        run: |
          shellcheck --severity=warning --shell=bash .claude/lib/*.sh

      - name: Check for eval usage (security)
        run: |
          if grep -r "eval " .claude/commands/*.sh | grep -v "# " | grep -v "eval git"; then
            echo "WARNING: eval usage found (except git log)"
            grep -r "eval " .claude/commands/*.sh | grep -v "# " | grep -v "eval git" || true
          fi

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint black mypy

      - name: Run Black check
        run: black --check scripts/

      - name: Run Pylint
        run: pylint scripts/init_core.py
        continue-on-error: true

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run tests
        run: python3 tests/test_init_core.py

  validate-markdown:
    name: Validate Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: articulate/actions-markdownlint@v1
        with:
          files: |
            **/*.md
            !.github/**/*.md
          config: .markdownlint.json

  validate-templates:
    name: Validate PRD Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate PRD template
        run: |
          # Check if template exists
          test -f scripts/templates/prd.md.template || exit 1

          # Validate YAML frontmatter in template
          python3 -c "
import re
template = open('scripts/templates/prd.md.template').read()
frontmatter = re.match(r'^---\n(.*?)\n---', template, re.DOTALL)
if not frontmatter:
    print('ERROR: No YAML frontmatter found')
    exit(1)
print('✓ PRD template validated')
"

  check-ci-cd-templates:
    name: Check CI/CD Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required templates
        run: |
          templates=(
            "scripts/templates/github-actions/basic.yml"
            "scripts/templates/github-actions/docker.yml"
            "scripts/templates/github-actions/kubernetes.yml"
            "scripts/templates/github-actions/monorepo.yml"
          )

          for tpl in "${templates[@]}"; do
            if [ -f "$tpl" ]; then
              echo "✓ Found $tpl"
            else
              echo "✗ Missing $tpl"
              exit 1
            fi
          done

  test-init-script:
    name: Test Init Script
    runs-on: ${{ matrix.os }}
    needs: test-python
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create test PRD
        run: |
          cat > test-project-prd.md << 'EOF'
          ---
          project_name: "Test CI Project"
          type: "cli"
          language: "python"
          framework: "none"
          git_default_branch: "main"
          ci_cd_provider: "none"
          ---
          # Test PRD
          EOF

      - name: Run init script
        run: |
          mkdir test-output
          cd test-output
          python3 ../scripts/init_core.py ../test-project-prd.md

      - name: Verify outputs
        run: |
          test -d test-output/.github || echo "WARNING: .github not created"
          test -f test-output/CLAUDE.md || echo "WARNING: CLAUDE.md not created"
