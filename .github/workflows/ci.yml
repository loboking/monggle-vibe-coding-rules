name: Vibe Coding Rules CI

# Vibe Coding Rules 프로젝트 CI 파이프라인

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    name: ShellCheck Bash Scripts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          else
            brew install shellcheck
          fi

      - name: Run ShellCheck on .claude/commands
        run: |
          shellcheck --severity=warning --shell=bash .claude/commands/*.sh

      - name: Run ShellCheck on .claude/lib
        run: |
          shellcheck --severity=warning --shell=bash .claude/lib/*.sh

      - name: Check for eval usage (security)
        run: |
          if grep -r "eval " .claude/commands/*.sh | grep -v "# " | grep -v "eval git"; then
            echo "WARNING: eval usage found (except git log)"
            grep -r "eval " .claude/commands/*.sh | grep -v "# " | grep -v "eval git" || true
          fi

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install pylint black mypy

      - name: Run Black check
        run: black --check scripts/

      - name: Run Pylint
        run: pylint scripts/
        continue-on-error: true

  test-python:
    name: Test Python
    runs-on: ${{ matrix.os }}
    needs: lint-python
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Bash library tests (TDD)
        run: python3 tests/test_lib_sh.py

  test-bash:
    name: Test Bash Scripts (bats-core)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            git clone https://github.com/bats-core/bats-core.git /tmp/bats
            sudo /tmp/bats/install.sh /usr/local
          else
            brew install bats-core
          fi

      - name: Verify bats installation
        run: bats --version

      - name: Run bats tests
        run: bats tests/bash/skills.bats

      - name: Run tests with verbose output on failure
        if: failure()
        run: bats --verbose --trace tests/bash/skills.bats

  validate-markdown:
    name: Validate Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: articulate/actions-markdownlint@v1
        with:
          files: |
            **/*.md
            !.github/**/*.md
          config: .markdownlint.json

# validate-templates / check-ci-cd-templates / test-init-script 잡은
# scripts/templates/ 및 scripts/init_core.py 가 refactor(ca15896)로 제거되면서
# 항상 실패하던 죽은 잡이라 삭제됨.
          test -f test-output/CLAUDE.md || echo "WARNING: CLAUDE.md not created"
